name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  OHMYGAME_REF: ${{ vars.OHMYGAME_REF || 'dev' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm test
