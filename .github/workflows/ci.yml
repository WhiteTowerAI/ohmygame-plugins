name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Companion app API 2.7: restore the default dev ref after app PR #822 merges.
  OHMYGAME_REF: 0cb107a6fc60b952030127ebae151efc03b7e0c1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm test
