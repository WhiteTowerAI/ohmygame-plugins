name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # API 2.6 companion: WhiteTowerAI/ohmygame#820. Restore dev after that PR merges, before merging this PR.
  OHMYGAME_REF: ${{ vars.OHMYGAME_REF || '9632a52605df121449e24366d2c5dbd2da37fecf' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm test
