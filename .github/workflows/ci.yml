name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # App #825 video-ratio contract; restore dev after it merges, before merging this PR.
  OHMYGAME_REF: 516be306090f8ecaeedf74e70b4074c3ecf24fa9

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm test
