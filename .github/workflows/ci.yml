name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # API 2.6 companion: WhiteTowerAI/ohmygame#820. Restore dev after that PR merges, before merging this PR.
  OHMYGAME_REF: ${{ vars.OHMYGAME_REF || 'e62ed79b4aed9e8cf242d98f26ead4c9210e6659' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm test
