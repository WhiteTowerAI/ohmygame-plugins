name: Publish plugins

# Releases each official plugin in plugins/ whose version has no GitHub
# release yet: tag `<folder>-v<version>` on this commit, with the package as
# its `.zip` asset (src/pack-release.ts). The index job lists, mirrors and
# signs it on its next run.

on:
  push:
    branches: [main]
    paths: ["plugins/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  OHMYGAME_REF: ${{ vars.OHMYGAME_REF || 'dev' }}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Packs and judges each plugin as the index will, so none is released that it would refuse.
      - run: npm test
      - name: Release what's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One that fails doesn't hold back the others.
          failed=()
          for dir in plugins/*/; do
            folder=$(basename "$dir")
            if [ "$(node -p "require('./${dir}package.json').private === true")" = "true" ]; then
              echo "$folder is held from release (private package)"
              continue
            fi
            version=$(node -p "require('./${dir}.ohmygame-plugin/plugin.json').version")
            tag="${folder}-v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released"
              continue
            fi
            archive="$RUNNER_TEMP/${folder}-${version}.zip"
            if ! (npx tsx --conditions=ohmygame-source src/pack-release.ts "$dir" "$archive" --app app \
              && gh release create "$tag" "$archive" --target "$GITHUB_SHA" --latest=false \
                --title "ohmygame/${folder} ${version}" --notes "ohmygame/${folder} ${version}"); then
              echo "::error::$tag wasn't released"
              failed+=("$tag")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Not released: ${failed[*]}"
            exit 1
          fi
