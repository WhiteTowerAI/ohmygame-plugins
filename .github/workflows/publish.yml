name: Publish plugins

# Publishes each official plugin in plugins/ whose version isn't on npm yet,
# with provenance, so the index shows its source as verified. npm trusted
# publishing (this workflow, on each package) needs no token; NPM_TOKEN is only
# for a package's first version, before it has a trusted publisher.

on:
  push:
    branches: [main]
    paths: ["plugins/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  OHMYGAME_REF: ${{ vars.OHMYGAME_REF || 'dev' }}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Packs and judges each plugin as the index will, so npm never gets one it would refuse.
      - run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build the checked app's plugin CLI
        working-directory: app
        run: bun run plugin-packages:build
      - name: Publish what's new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # `ohmygame-plugin check` from the app the tests judged with (OHMYGAME_REF), not the
          # published CLI, so a plugin on a plugin API that isn't released yet is checked by its rules.
          # One package npm refuses (such as one without its trusted publisher yet) doesn't hold back the others.
          failed=()
          for dir in plugins/*/; do
            if [ "$(node -p "require('./${dir}package.json').private === true")" = "true" ]; then
              echo "$dir is held from publication (private package)"
              continue
            fi
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already published"
              continue
            fi
            if ! (cd "$dir" && node "$GITHUB_WORKSPACE/app/packages/plugin-cli/dist/cli.mjs" check && npm publish --provenance); then
              echo "::error::$name@$version wasn't published"
              failed+=("$name@$version")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Not published: ${failed[*]}"
            exit 1
          fi
